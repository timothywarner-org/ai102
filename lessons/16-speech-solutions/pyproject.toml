[project]
name = "ai103-lesson16-speech-solutions"
version = "1.0.0"
description = "AI-103 Lesson 16 demo assets - speech solutions for agentic interactions"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tim Warner" }]

dependencies = [
    # Chat completions, including the input_audio content part in Beat 3.
    # Plain OpenAI client, NOT AzureOpenAI: AzureOpenAI appends an api-version
    # query parameter and the /v1 path rejects it.
    "openai>=1.68.0",
    # AzureCliCredential. Keyless everywhere; no API key in this lesson.
    "azure-identity>=1.19.0",
    # load_dotenv(override=True), so a stale shell var cannot shadow .env
    "python-dotenv>=1.2.0",
    "azure-cognitiveservices-speech>=1.51.1",
]

# NOT HERE: azure-cognitiveservices-speech (the Speech SDK).
# The SDK is the right call for production -- it streams, it raises events, it
# handles reconnects. These scripts use the REST surface with urllib because the
# REQUEST SHAPE is the lesson: the composite aad# token, the SSML body, the
# X-Microsoft-OutputFormat header, and the Phrase-List header are all things the
# exam expects you to recognize. The SDK hides every one of them.

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]
