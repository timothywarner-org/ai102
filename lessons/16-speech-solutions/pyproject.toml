[project]
name = "ai103-lesson16-speech-solutions"
version = "1.0.0"
description = "AI-103 Lesson 16 demo assets - speech solutions for agentic interactions"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tim Warner" }]

dependencies = [
    # Voice Live: speech in, speech out, one WebSocket. The [aiohttp] extra is
    # REQUIRED -- the async transport imports aiohttp at module load and raises
    # a confusing ImportError without it.
    "azure-ai-voicelive[aiohttp]>=1.3.0",
    # Batch STT/TTS for the pipeline comparison beat. This is the SDK the
    # "do it yourself" path uses, and showing both is the lesson.
    "azure-cognitiveservices-speech>=1.40.0",
    # AzureCliCredential. Keyless everywhere; there is no API key in this lesson.
    "azure-identity>=1.19.0",
    # load_dotenv(override=True), so a stale shell var cannot shadow .env
    "openai>=3.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]
