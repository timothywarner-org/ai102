[project]
name = "ai103-m08-demos"
version = "1.0.0"
description = "AI-103 Module 8 demo: retrieval-augmented generation (RAG) with Azure AI Search + text-embedding-3-large, keyless via Entra ID."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "azure-identity>=1.19.0",
    "azure-search-documents>=11.5.2",
    "openai>=1.109.0",
    "python-dotenv>=1.0.0",
]

[tool.pylint.format]
max-line-length = 120
