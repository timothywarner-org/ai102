# Dependabot configuration for the AI-103 learner companion repo.
# Automated dependency updates for the real course demo apps only.
#
# DELIBERATELY EXCLUDED from scanning (do not add them back):
#   - lesson-demo-apps/globomantics-secure-scan-1  (INTENTIONALLY VULNERABLE -- the SAST/CodeQL
#   - lesson-demo-apps/globomantics-vulnerable-app-1  lesson. Bumping its deps defeats the demo.)
#   - lesson-demo-apps/tim-chat-front-end/ideas-for-pondering/**  (scratch/experimental sandbox,
#                                                                  not course material.)
# The previous config scanned "/" recursively, which pulled those in and produced a flood of
# conflicting PRs against the vulnerable apps. Listing explicit directories fixes that at the source.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Node.js course demo apps -- explicit directories, so the vulnerable apps and the
  # scratch sandbox are never scanned.
  - package-ecosystem: "npm"
    directories:
      - "/lesson-demo-apps/azure-appinsights-node-sample-app"
      - "/lesson-demo-apps/tim-chat-front-end"
      - "/lesson-demo-apps/tim-chat-front-end/frontend"
      - "/lesson-demo-apps/woodgrove-bank"
      - "/lesson-demo-apps/woodgrove-bank/ai-search-document-intelligence/client"
      - "/lesson-demo-apps/woodgrove-bank/ai-search-document-intelligence/server"
      - "/lesson-demo-apps/woodgrove-bank/doc-intel"
      - "/lesson-demo-apps/woodgrove-bank/doc-intel/client"
      - "/lessons/07-optimize-operationalize-genai/node-demo"
      - "/lessons/10-build-agents-foundry/node-demo"
      - "/lessons/13-multimodal-understanding/node-demo"
      - "/lessons/15-language-model-text-analysis/node-demo"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"       # 03:00 Central (UTC-6)
    groups:
      # One grouped PR per directory instead of a swarm of singles.
      npm-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - timothywarner
    labels:
      - "dependencies"
      - "dependabot"

  # Python lesson demos (uv/pyproject) live under lessons/NN-*/. Scan the repo for pip manifests.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - timothywarner
    labels:
      - "dependencies"
      - "dependabot"

# Learner notes:
# - Dependabot checks weekly (Saturday 09:00 UTC / 03:00 Central) and opens ONE grouped PR per app.
# - The intentionally-vulnerable globomantics apps are excluded on purpose so the security lesson
#   stays intact. Do not add them to the directories list.
